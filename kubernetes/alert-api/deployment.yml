kind: Deployment
apiVersion: apps/v1 
metadata:
  name: alert-api
  namespace: production
  labels: 
    app: alert-api
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alert-api
  template:
    metadata:
      labels:
        app: alert-api
        version: v1.0.0
    spec:
      serviceAccountName: default
      containers:
        - name: alert-api
          image: 882083662991.dkr.ecr.ap-south-1.amazonaws.com/fintech/alert-api:v1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: AWS_REGION
              value: "ap-south-1"
            - name: DYNAMODB_TABLE
              value: "fintech-alerts"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:  
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10