apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-calculator
  namespace: production
  labels:
    app: portfolio-calculator
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-calculator
  template:
    metadata:
      labels:
        app: portfolio-calculator
        version: v1.0.0
    spec:
      serviceAccountName: default
      containers:
        - name: portfolio-calculator
          image: 882083662991.dkr.ecr.ap-south-1.amazonaws.com/fintech/portfolio-calculator:v1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: AWS_REGION
              value: "ap-south-1"
            - name: DYNAMODB_TABLE
              value: "fintech-portfolios"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10